# Railway build/run configuration.
#
# Nixpacks auto-detects PHP from composer.json and Node from package.json;
# this file only pins the parts that need to be explicit: which PHP
# extensions to provision (dompdf needs gd for embedded images, the Word
# export needs zip), and what runs on every boot.
#
# Migrations and storage:link run on every start rather than as a separate
# release step, because Railway's free/hobby plans don't offer one and
# Laravel's migrate is safe to re-run (it skips what's already applied).

[phases.setup]
nixPkgs = ["php82", "php82Extensions.gd", "php82Extensions.zip", "php82Packages.composer"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci",
    "npm run build",
]

[start]
cmd = "php artisan migrate --force --no-interaction && (php artisan storage:link || true) && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
